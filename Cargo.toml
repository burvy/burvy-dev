[package]
name = "burvy-dev"
version = "0.1.0"
edition = "2024"

[dependencies]
life-v2 = { path = "../life-v2" }
game = { path = "game"}
gloo-net = { version = "0.7.0", features = ["json"] }
js-sys = "0.3.102"
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = "0.8.13"
serde = { version = "1.0.228", features = ["derive"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "MouseEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WebTransport",
    "WebTransportSendStream",
    "WebTransportBidirectionalStream",
    "WebTransportReceiveStream",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }
