# its own workspace, like server/: native, while burvy-dev's workspace is wasm
[workspace]

[package]
name = "plgroup-server"
version = "0.1.0"
edition = "2024"

[features]
# plain http on localhost, a throwaway database, CORS for trunk serve
dev-local = []

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
plgroup-api = { path = "../crates/plgroup-api" }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.27.0", features = ["v4"] }
