[package]
name = "floret-wasm"
version = "0.1.0"
edition = "2024"

# cdylib so this links into a standalone wasm module the site imports at runtime
# instead of being statically linked into the main bundle.
[lib]
crate-type = ["cdylib"]

[dependencies]
floret = { path = "../../../floret" }
wasm-bindgen = "0.2.125"

# bevy pulls these in and they refuse to build for wasm without their backend
# feature on. Same fix as the other experiences.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
