[package]
name = "life-wasm"
version = "0.1.0"
edition = "2024"

# cdylib so this links into a standalone wasm module the site can import at
# runtime, instead of being statically linked into the main bundle.
[lib]
crate-type = ["cdylib"]

[dependencies]
life-v2 = { path = "../../../life-v2" }
wasm-bindgen = "0.2.125"
