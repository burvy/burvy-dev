[package]
name = "plgroup"
version = "0.1.0"
edition = "2024"

# rlib so burvy-dev links it in for burvy.dev/plgroup,
# cdylib so trunk can build it standalone for embedding on sites.psu.edu
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo-net = { version = "0.7.0", features = ["json"] }
js-sys = "0.3.102"
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = "0.8.13"
wasm-bindgen = "0.2.125"
plgroup-api = { path = "../plgroup-api" }
serde = "1.0.228"
web-sys = { version = "0.3.102", features = ["Storage", "Location"] }
