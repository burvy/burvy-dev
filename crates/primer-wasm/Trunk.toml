# Lets this module be built with a plain `trunk build --release` from this
# directory. Output goes straight into the site's assets/, where the main
# build picks it up with copy-dir.
[build]
dist = "../../assets/primer"
# the site imports /primer/primer-wasm.js by a fixed path, so no hashing
filehash = false
no_sri = true
html_output = "_module.html"
