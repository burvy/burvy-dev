<!doctype html>
<!-- Trunk needs an index.html to drive a build, but nothing here is served.
     Only the emitted floret-wasm.js / floret-wasm_bg.wasm pair is copied into
     the site and imported on demand by the /floret route. -->
<html>
    <head>
        
<script type="module">
import init, * as bindings from '/floret-wasm.js';
const wasm = await init({ module_or_path: '/floret-wasm_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <link rel="modulepreload" href="/floret-wasm.js" crossorigin="anonymous"><link rel="modulepreload" href="/snippets/burvy-dev-15e93f376a2dd54c/inline0.js" crossorigin="anonymous"><link rel="preload" href="/floret-wasm_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
    <body></body>
</html>
