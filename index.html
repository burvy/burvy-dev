<!doctype html>
<html>
    <head>
        <title>burvy's site</title>
        <link data-trunk rel="rust" data-wasm-opt="s" data-wasm-opt-params="-all" />
        <!-- copies assets/images folder into dist/images -->
        <link
            data-trunk
            rel="copy-dir"
            href="assets/images"
            data-target-path="images"
        />
        <link
            data-trunk
            rel="copy-dir"
            href="assets/sounds"
            data-target-path="sounds"
        />
        <!-- lazily-loaded wasm experiences, built by build.sh before this
             runs. they are fetched on demand by /game, /life, /shooter and
             /floret, never part of the initial page load -->
        <link
            data-trunk
            rel="copy-dir"
            href="assets/game"
            data-target-path="game"
        />
        <link
            data-trunk
            rel="copy-dir"
            href="assets/life"
            data-target-path="life"
        />
        <link
            data-trunk
            rel="copy-dir"
            href="assets/shooter"
            data-target-path="shooter"
        />
        <link
            data-trunk
            rel="copy-dir"
            href="assets/floret"
            data-target-path="floret"
        />
        <link
            data-trunk
            rel="copy-dir"
            href="assets/venture"
            data-target-path="venture"
        />
        <!-- Godot web export, not a Rust wasm module - dropped in manually,
             see assets/3d-learn/README.md -->
        <link
            data-trunk
            rel="copy-dir"
            href="assets/3d-learn"
            data-target-path="3d-learn"
        />


        <link
            data-trunk
            rel="copy-dir"
            href="assets/halcyon"
            data-target-path="halcyon"
        />
        <link data-trunk rel="css" href="styles/app.css" />
    </head>
    <body></body>
</html>
